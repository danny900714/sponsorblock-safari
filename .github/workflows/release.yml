name: Release
run-name: Release ${{ inputs.release-name }} (based on SponsorBlock ${{ inputs.upstream-tag }})
on:
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: The tag of the upstream repository to release from
        required: true
        type: string
      release-name:
        description: The name of the release
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release-name }}

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Download the SponsorBlock release asset
        run: gh release download "$RELEASE_TAG" -p 'SafariExtension.zip'
        env:
          RELEASE_TAG: ${{ inputs.upstream-tag }}
          GH_REPO: ajayyy/SponsorBlock
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the Safari extension
        run: unzip SafariExtension.zip -d SafariExtension

      - name: Create an Xcode project for Safari web extension
        run: xcrun safari-web-extension-packager --bundle-identifier io.github.danny900714.sponsorblock --app-name sponsorblock --macos-only --no-open SafariExtension

      - name: Build
        working-directory: sponsorblock
        run: |
          current_project_version=$(date +%s)

          xcrun xcodebuild -configuration Release \
          MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$current_project_version" \
          MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
          CODE_SIGNING_ALLOWED=NO \
          build
        env:
          MARKETING_VERSION: ${{ inputs.upstream-tag }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: &artifact-name sponsorblock
          path: sponsorblock/build/Release/sponsorblock.app

  sign:
    name: Sign
    runs-on: macos-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: *artifact-name

      - name: List all files
        run: ls -R
