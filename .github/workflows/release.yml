name: Release
run-name: Release ${{ inputs.release-name }} (based on SponsorBlock ${{ inputs.upstream-tag }})
on:
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: The tag of the upstream repository to release from
        required: true
        type: string
      release-name:
        description: The name of the release
        required: true
        type: string

env:
  DMG_NAME: sponsorblock-${{ inputs.release-name }}.dmg

permissions: {}

concurrency:
  group: release-${{ inputs.release-name }}

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Download the SponsorBlock release asset
        run: gh release download "$RELEASE_TAG" -p 'SafariExtension.zip'
        env:
          RELEASE_TAG: ${{ inputs.upstream-tag }}
          GH_REPO: ajayyy/SponsorBlock
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the Safari extension
        run: unzip SafariExtension.zip -d SafariExtension

      - name: Create an Xcode project for Safari web extension
        run: xcrun safari-web-extension-packager --bundle-identifier io.github.danny900714.sponsorblock --app-name sponsorblock --macos-only --no-open SafariExtension

      - name: Build
        working-directory: sponsorblock
        run: |
          current_project_version=$(date +%s)

          xcrun xcodebuild \
            -configuration Release \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$current_project_version" \
            MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            build
        env:
          MARKETING_VERSION: ${{ inputs.upstream-tag }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent sponsorblock/build/Release/sponsorblock.app sponsorblock-unsigned.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: sponsorblock-unsigned.zip
          archive: false
          if-no-files-found: error

  sign:
    name: Sign
    runs-on: macos-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: sponsorblock-unsigned.zip
          skip-decompress: true

      - name: Extract artifact
        run: ditto -x -k sponsorblock-unsigned.zip . && rm sponsorblock-unsigned.zip

      - name: Import codesign certificates
        id: certs
        uses: apple-actions/import-codesign-certs@v7.2.0
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

      - name: Sign the app
        run: |
          hash=$(jq -r 'first(.[] | select(.name | startswith("Apple Development:")) | .hash)' <<<"$IDENTITIES")

          codesign \
            -s "$hash" \
            --options runtime \
            --entitlements 'sponsorblock Extension.entitlements' \
            'sponsorblock.app/Contents/PlugIns/sponsorblock Extension.appex' && \
          codesign \
            -s "$hash" \
            --options runtime \
            --entitlements sponsorblock.entitlements \
            sponsorblock.app
        env:
          IDENTITIES: ${{ steps.certs.outputs.identities }}

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent sponsorblock.app sponsorblock.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: sponsorblock.zip
          archive: false
          if-no-files-found: error

  package:
    name: Package
    runs-on: macos-latest
    needs: sign

    permissions:
      id-token: write     # for attestations
      attestations: write # for attestations

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: sponsorblock.zip
          skip-decompress: true

      - name: Extract artifact
        run: ditto -x -k sponsorblock.zip . && mv sponsorblock.app 'SponsorBlock for YouTube.app'

      - name: Create DMG
        run: npx create-dmg --no-code-sign --no-version-in-filename --dmg-title 'SponsorBlock for YouTube' 'SponsorBlock for YouTube.app'

      - name: Rename DMG
        run: mv sponsorblock.dmg "$DMG_NAME"

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.DMG_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ env.DMG_NAME }}
          archive: false
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: package

    permissions:
      contents: write # for creating GitHub release

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.DMG_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: ${{ inputs.release-name }}
          tag_name: v${{ inputs.release-name }}
          body: This release is based on upstream [SponsorBlock ${{ inputs.upstream-tag }}](https://github.com/ajayyy/SponsorBlock/releases/tag/${{ inputs.upstream-tag }}).
          generate_release_notes: true
          files: ${{ env.DMG_NAME }}
          fail_on_unmatched_files: true

  bump-homebrew-cask:
    name: Bump Homebrew cask
    runs-on: ubuntu-latest
    needs: github-release

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.HOMEBREW_CASK_BUMPER_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_CASK_BUMPER_PRIVATE_KEY }}
          repositories: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          permission-actions: write

      - name: Dispatch bump cask workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          CASK: ${{ vars.HOMEBREW_CASK_TOKEN }}
          VERSION: ${{ inputs.release-name }}
        run: |
          output=$(gh workflow run bump-cask.yml -f cask="$CASK" -f version="$VERSION")
          echo "Workflow run URL: $output"
          run_id=$(grep -oE 'runs/[0-9]+' <<< "$output" | head -1 | cut -d / -f 2)
          gh run watch "$run_id" --exit-status
